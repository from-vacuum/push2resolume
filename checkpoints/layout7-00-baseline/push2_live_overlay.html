<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Push 2 Live Overlay</title>
<style>
:root{
  --chassis:#151417; --panel:#1e1d21; --panel-2:#26252a;
  --pad-off:#39373d; --pad-off-2:#302f34;
  --ink:#eae7e1; --ink-dim:#a9a6a3; --ink-faint:#6f6c70; --rule:#38363b;
  --amber:#ff7a1a; --magenta:#ff3f7f; --cyan:#28d9d9; --violet:#9a6bff;
  --good:#3ddc84; --bad:#ff5b5b;
  --mono: ui-monospace,"SF Mono","Cascadia Code",Menlo,Consolas,monospace;
  --sans: -apple-system,"Helvetica Neue",ui-sans-serif,Arial,sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;background:var(--chassis);color:var(--ink);font-family:var(--sans);}
body{padding:24px 20px 60px;display:flex;flex-direction:column;align-items:center;gap:16px;}
h1{font-size:18px;margin:0;font-weight:700;}
.status{
  display:flex;gap:10px;flex-wrap:wrap;justify-content:center;
  font-family:var(--mono);font-size:11px;
}
.chip{padding:4px 10px;border-radius:20px;background:var(--panel-2);color:var(--ink-dim);display:flex;align-items:center;gap:6px;}
.chip.on{color:var(--good);}
.chip.off{color:var(--bad);}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;}
.armed{font-family:var(--mono);font-size:13px;font-weight:700;padding:6px 14px;border-radius:20px;}
.armed.yes{background:rgba(61,220,132,0.15);color:var(--good);border:1px solid rgba(61,220,132,0.3);}
.armed.no{background:rgba(255,91,91,0.15);color:var(--bad);border:1px solid rgba(255,91,91,0.3);}
.unit{
  background:linear-gradient(180deg,var(--panel),var(--chassis));
  border:1px solid var(--rule);border-radius:16px;padding:20px;
  width:100%;max-width:760px;
}
.padgrid{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);gap:6px;aspect-ratio:1;}
.pad{
  border-radius:6px;font-family:var(--mono);font-size:10px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;border:1px solid rgba(0,0,0,0.4);color:rgba(255,255,255,0.7);
  background:var(--pad-off);transition:background .15s,box-shadow .15s;position:relative;
}
.pad .lbl{font-size:8px;opacity:0.75;max-width:90%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pad.pulse{box-shadow:0 0 0 2px rgba(255,255,255,0.5) inset;}
.meta{font-family:var(--mono);font-size:11px;color:var(--ink-dim);display:flex;gap:16px;flex-wrap:wrap;justify-content:center;}
.err{color:var(--bad);font-family:var(--mono);font-size:12px;text-align:center;max-width:500px;}
.modebar{display:flex;gap:2px;background:var(--panel-2);border-radius:8px;padding:3px;font-family:var(--mono);font-size:12px;}
.modebar button{appearance:none;border:none;background:transparent;color:var(--ink-dim);padding:6px 14px;border-radius:6px;cursor:pointer;font-family:var(--mono);font-size:12px;}
.modebar button.active{background:var(--pad-off);color:var(--ink);}
.refpanel{display:none;flex-direction:column;gap:22px;width:100%;max-width:900px;}
.refpanel.show{display:flex;}
.refgroup h2{font-size:13px;margin:0 0 10px;color:var(--ink-dim);font-weight:700;letter-spacing:0.03em;text-transform:uppercase;}
.refrow{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;}
.refcard{background:var(--panel-2);border:1px solid var(--rule);border-radius:10px;padding:10px 12px;cursor:default;}
.refcard.reserved{opacity:0.45;}
.refcard .rc-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px;}
.refcard .rc-title{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:0.02em;}
.refcard .rc-badge{font-size:9px;padding:2px 7px;border-radius:20px;background:var(--pad-off);color:var(--ink-dim);white-space:nowrap;}
.refcard .rc-fn{font-size:11px;color:var(--amber);margin-top:4px;}
.refcard .rc-hint{font-size:11px;color:var(--ink-dim);margin-top:4px;line-height:1.4;}
.refcard .rc-tags{font-size:9px;color:var(--ink-faint);margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;}
.refcard .rc-tags span{background:rgba(255,255,255,0.05);padding:1px 6px;border-radius:10px;}
</style>
</head>
<body>
<h1>Push 2 &times; Resolume -- Live State</h1>
<div class="status" id="status"></div>
<div class="modebar">
  <button data-mode="SESSION" class="active">Session</button>
  <button data-mode="FX">FX</button>
  <button data-mode="REFERENCE">Reference</button>
</div>
<div class="unit" id="liveUnit"><div class="padgrid" id="grid"></div></div>
<div class="meta" id="meta"></div>
<div class="err" id="err"></div>
<div class="refpanel" id="refpanel"></div>

const pal = DATA.palette;
function rgb(name, alpha){
  const p = pal[name]; if(!p) return null;
  return `rgba(${p.r},${p.g},${p.b},${alpha===undefined?1:alpha})`;
}
let mode = 'SESSION';
let lastFx = {};
const rowsTopToBottom = [];
for(let s=1;s<=8;s++) rowsTopToBottom.push(100 - s*8);

const gridEl = document.getElementById('grid');
const cells = [];
rowsTopToBottom.forEach(base=>{
  for(let t=0;t<8;t++){
    const logical = base+t;
    const el = document.createElement('div');
    el.className = 'pad';
    el.innerHTML = `<span class="n">${logical+1}</span><span class="lbl"></span>`;
    cells.push({logical, el});
    gridEl.appendChild(el);
  }
});

document.querySelectorAll('.modebar button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    mode = btn.dataset.mode;
    document.querySelectorAll('.modebar button').forEach(b=>b.classList.toggle('active', b===btn));
    const isRef = mode === 'REFERENCE';
    document.getElementById('liveUnit').style.display = isRef ? 'none' : '';
    document.getElementById('meta').style.display = isRef ? 'none' : '';
    document.getElementById('refpanel').classList.toggle('show', isRef);
    if(isRef) buildReference();
    else render(lastState);
  });
});

function humanize(s){
  return String(s).replace(/_/g,' ').replace(/\b\w/g, c=>c.toUpperCase());
}
const TARGET_LABELS = {
  LAYER1:'Layer 1', LAYER2:'Layer 2', LAYER3:'Layer 3',
  COMPOSITION:'Composition', SURFACE:'Push 2 Surface',
};
function targetLabel(t){ return TARGET_LABELS[t] || humanize(t); }
const VARIANT_LABELS = { plain:'Tap', SHIFT:'Shift', SELECT:'Select' };

function refCard(entry, variant, extraTag){
  const isReserved = entry.action === 'reserved';
  const card = document.createElement('div');
  card.className = 'refcard' + (isReserved ? ' reserved' : '');
  card.title = [entry.transport ? `transport: ${entry.transport}` : '', entry.path ? `path: ${entry.path}` : '']
    .filter(Boolean).join('\n');
  const badge = VARIANT_LABELS[variant] || variant;
  card.innerHTML = `
    <div class="rc-top"><span class="rc-title">${humanize(entry.id)}</span><span class="rc-badge">${badge}</span></div>
    ${isReserved ? '<div class="rc-hint">Unused / reserved -- no function assigned.</div>' :
      `<div class="rc-fn">${humanize(entry.action)}</div>
       <div class="rc-hint">${entry.notes || ''}</div>
       <div class="rc-tags">${entry.target ? `<span>${targetLabel(entry.target)}</span>` : ''}${extraTag ? `<span>${extraTag}</span>` : ''}</div>`}
  `;
  return card;
}

let referenceBuilt = false;
function buildReference(){
  if(referenceBuilt) return;
  referenceBuilt = true;
  const panel = document.getElementById('refpanel');

  function group(title, rows){
    const g = document.createElement('div');
    g.className = 'refgroup';
    const h = document.createElement('h2'); h.textContent = title; g.appendChild(h);
    const row = document.createElement('div'); row.className = 'refrow';
    rows.forEach(el => row.appendChild(el));
    g.appendChild(row);
    panel.appendChild(g);
  }

  // Pads: group by SESSION vs FX mode, tagged with hardware row/col (not MIDI note numbers).
  ['SESSION','FX'].forEach(padMode=>{
    const cards = [];
    Object.keys(DATA.controls.pads).map(Number).sort((a,b)=>a-b).forEach(note=>{
      const entry = DATA.controls.pads[String(note)][padMode];
      if(!entry) return;
      const rowBase = rowsTopToBottom.find(b => note >= b && note < b+8);
      const rowNum = rowsTopToBottom.indexOf(rowBase) + 1;
      const colNum = note - rowBase + 1;
      const tag = `R${rowNum}C${colNum}`;
      Object.keys(entry).forEach(variant => cards.push(refCard(entry[variant], variant, tag)));
    });
    if(cards.length) group(padMode === 'SESSION' ? 'Session Pads (8x8 grid)' : 'FX Pads (8x8 grid)', cards);
  });

  // Right-column / top / bottom row buttons and encoders. ccs is nested by
  // grid_mode (ANY/SESSION/FX) same as pads -- a control can carry a
  // different row per mode (e.g. the 8 main encoders: SESSION opacity vs.
  // FX Dashboard link), so tag the card with its mode when it's not ANY.
  const ccCards = [];
  Object.keys(DATA.controls.ccs).map(Number).sort((a,b)=>a-b).forEach(cc=>{
    const byMode = DATA.controls.ccs[String(cc)];
    Object.keys(byMode).forEach(gridMode => {
      const entry = byMode[gridMode];
      Object.keys(entry).forEach(variant => {
        const base = entry[variant].zone ? humanize(entry[variant].zone) : '';
        const tag = gridMode === 'ANY' ? base : (base ? `${base} / ${gridMode}` : gridMode);
        ccCards.push(refCard(entry[variant], variant, tag));
      });
    });
  });
  if(ccCards.length) group('Buttons & Encoders', ccCards);

  // Encoder touches.
  const touchCards = [];
  Object.keys(DATA.controls.touches).map(Number).sort((a,b)=>a-b).forEach(i=>{
    const entry = DATA.controls.touches[String(i)];
    touchCards.push(refCard(entry, 'plain', `Encoder ${Number(i)+1}`));
  });
  if(touchCards.length) group('Encoder Touch', touchCards);
}

let lastState = null;

function render(state){
  if(!state) return;
  lastState = state;
  const statusEl = document.getElementById('status');
  statusEl.innerHTML = `<span class="armed ${state.armed?'yes':'no'}">${state.armed?'ARMED':'NOT ARMED'}</span>` +
    Object.entries(state.health).map(([k,v])=>
      `<span class="chip ${v?'on':'off'}"><span class="dot"></span>${k}</span>`).join('');

  cells.forEach(({logical, el})=>{
    const entry = DATA.controls.pads[String(logical)];
    let bg = 'var(--pad-off)';
    let label = '';
    if(entry && entry[mode]){
      const v = entry[mode]['plain'];
      if(mode === 'SESSION' && v && v.action === 'clip_connect'){
        const lyr = v.target === 'LAYER1' ? '1' : v.target === 'LAYER2' ? '2' : v.target === 'LAYER3' ? '3' : null;
        const layerIds = {'1':'1','2':'2','3':'3'};
        // slot expr evaluated with bank=state.bank
        let slot;
        try{ slot = eval(v.slot.replace('bank', state.bank - 1)); }catch(e){ slot = null; }
        const key = lyr + ':' + slot;
        const connected = state.clips[key];
        bg = connected ? (rgb('L'+lyr+'_FULL') || bg) : (rgb('L'+lyr+'_DIM',0.5) || bg);
      } else if(mode === 'SESSION' && v && v.action === 'column_connect'){
        bg = 'rgba(154,107,255,0.35)';
      } else if(mode === 'FX' && v && v.action === 'fx_opacity_toggle'){
        let slot;
        try{ slot = eval(v.slot.replace('bank', state.bank - 1)); }catch(e){ slot = null; }
        const key = v.target + ':' + slot;
        const fx = state.fx[key];
        if(fx){
          label = fx.label;
          if(fx.bypassed) bg = 'rgba(255,91,91,0.35)';
          else if(fx.padOn) bg = rgb('L1_FULL') || 'var(--pad-off-2)';
          else bg = 'var(--pad-off-2)';
        }
      }
    }
    el.style.background = bg;
    el.querySelector('.lbl').textContent = label;
  });

  document.getElementById('meta').innerHTML =
    `<span>grid: ${state.gridMode}</span><span>bank: ${state.bank}</span>` +
    `<span>modifiers: ${state.modifiers.join(',')||'none'}</span>` +
    `<span>fx discovered: ${Object.keys(state.fx).length}</span>`;
}

async function poll(){
  try{
    const res = await fetch('http://127.0.0.1:9871/state', {cache:'no-store'});
    const state = await res.json();
    document.getElementById('err').textContent = '';
    render(state);
  }catch(e){
    document.getElementById('err').textContent = 'Cannot reach http://127.0.0.1:9871/state -- is TD running with webserver1 active? (' + e.message + ')';
  }
}
poll();
setInterval(poll, 200);
